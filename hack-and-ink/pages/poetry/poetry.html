<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Poetry | Hawa &amp; Ink</title>
    <meta
      name="description"
      content="Read short original poems. Search by title, line or poet and filter by theme."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Poetry | Hawa &amp; Ink" />
    <meta property="og:description" content="Read short original poems. Search by title, line or poet and filter by theme." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" type="image/svg+xml" href="../../assets/images/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,400&family=DM+Sans:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="../../assets/styling/style.css" />
    <link rel="stylesheet" href="poetry.css" />
    <script src="../../assets/js/main.js" defer></script>
    <script src="poetry.js" defer></script>
  </head>
  <body data-root="../../" data-page="poetry">
    <div id="prog"></div>
    <header id="site-header"></header>
    <main>
      <div class="wrap pagehead">
        <h1>Poetry</h1>
        <p class="lead" style="color: var(--muted)">
          Search by title, line or poet. Open any poem for a distraction-free
          reader.
        </p>
      </div>
      <div class="wrap">
        <div class="tools">
          <input
            id="q"
            type="search"
            placeholder="Search poems (press /)"
            aria-label="Search poems"
          /><select id="sort" aria-label="Sort poems">
            <option value="new">Newest</option>
            <option value="az">Title A–Z</option>
            <option value="short">Shortest first</option>
          </select>
        </div>
        <div class="chips" id="chips"></div>
        <p class="meta" id="count"></p>
        <div class="grid" id="results"></div>
        <button class="btn line load-more" id="load-more" type="button" hidden>Load more poems</button>
      </div>
    </main>
    <footer id="site-footer"></footer>
  </body>
</html>
